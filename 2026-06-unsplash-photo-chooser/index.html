<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>unsplash-photo-chooser</title>
  </head>
  <body>
  <div class="container mt-4">
    <div class="w-50">
      <label class="form-label" for="key">Search for...</label>
      <div class="input-group">
        <input class="form-control" id="key" name="key" value="" type="search" placeholder="es. mountains, city, food…">
        <button class="btn btn-primary" id="search-btn" type="button">Search</button>
      </div>
    </div>

    <div id="result"></div>

    <div class="mt-lg">
      <h2>Refs</h2>
      <ul>
        <li><a href="https://docs.imgix.com/en-US/getting-started/tutorials/responsive-design/using-imgix-with-picture" target="_blank" rel="noopener noreferrer">https://docs.imgix.com/en-US/getting-started/tutorials/responsive-design/using-imgix-with-picture</a></li>
      </ul>
    </div>
  </div>

  <script src="index.js" type="module"></script>
  </body>
</html>
