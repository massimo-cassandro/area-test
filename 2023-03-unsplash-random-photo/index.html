<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Random Photo</title>
    <link rel="stylesheet" href="./random-photo.css" type="text/css" media="all">
    <link rel="icon" href="data:;base64,=">
  </head>
  <body>
    <div class="container">
      <div class="loader-wrapper"><div class="loader"></div></div>

      <div class="icons">
        <div class="photo-link">
          <a href="#" target="_blank" rel="noopener noreferrer">
            <img src="./svg/image.svg" alt="" />
          </a>
        </div>
        <button class="slideshow off" type="button">
          <img src="./svg/projector-screen.svg" alt="">
        </button>
        <button class="full-img-trigger" type="button">
          <img class="off" src="./svg/arrows-out.svg" alt="">
          <img src="./svg/arrows-in.svg" alt="">
        </button>
        <button class="reload" type="button">
          <img src="./svg/arrow-clockwise.svg" alt="">
        </button>
      </div>
      <div class="credits"></div>
    </div>
    <script src="./random-photo.js" type="module"></script>
  </body>
</html>
